<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#050507" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MakePattern" />
    <meta name="description" content="Track DSA patterns, solve LeetCode problems and review with spaced repetition." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MakePattern - DSA Curriculum</title>
    <script>
      // Apply saved display preferences before first paint (no theme/font flash).
      (function() {
        var root = document.documentElement;
        try {
          var prefs = JSON.parse(localStorage.getItem('mp-prefs') || 'null') || {};
          var theme = prefs.theme || localStorage.getItem('mp-theme') || 'dark';
          if (theme === 'system') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          root.classList.remove('light', 'dark');
          root.classList.add(theme === 'light' ? 'light' : 'dark');
          if (prefs.high_contrast) root.classList.add('mp-hc');
          var reduce = typeof prefs.reduced_motion === 'boolean'
            ? prefs.reduced_motion
            : !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          if (reduce) root.classList.add('mp-reduce-motion');
          root.setAttribute('data-mp-scale', prefs.ui_scale || 'md');
          var fonts = {
            readable: ['https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap'],
            dyslexic: [
              'https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.2.5/400.css',
              'https://cdn.jsdelivr.net/npm/@fontsource/opendyslexic@5.2.5/700.css'
            ]
          };
          if (fonts[prefs.font_family]) {
            root.classList.add('mp-font-' + prefs.font_family);
            fonts[prefs.font_family].forEach(function(href) {
              var link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = href;
              link.setAttribute('data-mp-font', prefs.font_family);
              document.head.appendChild(link);
            });
          }
        } catch (e) {
          root.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-black text-[#f5f5f7]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
