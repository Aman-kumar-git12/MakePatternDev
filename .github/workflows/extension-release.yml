name: extension-release

# Builds the Coding Journey extension and publishes downloadable zips as a GitHub Release.
# Trigger: push a tag named ext-v<version> matching extension/package.json "version",
#   git tag ext-v0.2.0 && git push origin ext-v0.2.0
# or run it manually (Actions -> extension-release -> Run workflow) to get the zips as an artifact.

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ext-v$tag does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run zip:all

      - name: Upload zips as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-journey-extension
          path: extension/dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes="Coding Journey browser extension v${version}.

          Chrome / Edge / Brave: download the -chrome.zip, unzip it, open chrome://extensions, enable Developer mode, click Load unpacked and pick the unzipped folder.
          Firefox 128+: download the -firefox.zip and load it via about:debugging -> This Firefox -> Load Temporary Add-on.

          Full instructions: extension/README.md#install"
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Coding Journey extension v${version}" \
            --notes "$notes"
