name: extension-release

# Builds the Coding Journey extension and publishes it as a GitHub Release with one asset,
# coding-journey-extension.zip, which unzips to a ready-to-load coding-journey-extension/ folder.
# Trigger: push a tag named ext-v<version> matching frontend/extension/package.json "version",
#   git tag ext-v0.2.0 && git push origin ext-v0.2.0
# or run it manually (Actions -> extension-release -> Run workflow) to get the zip as an artifact.

on:
  push:
    tags: ['ext-v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/extension/package-lock.json

      - run: npm ci

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#ext-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ext-v$tag does not match package.json version $version"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run package

      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: coding-journey-extension
          path: frontend/extension/dist/coding-journey-extension.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          notes="Coding Journey browser extension v${version} for Chrome, Edge and Brave.

          How to install:
          1. Download coding-journey-extension.zip below and unzip it. You get a folder named coding-journey-extension.
          2. Open chrome://extensions and turn on Developer mode (top right).
          3. Click Load unpacked and select the coding-journey-extension folder.

          To update, replace that folder with the new one and click the reload icon on the extension's card. Your data is kept.
          Full guide: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/frontend/extension/README.md#install"
          gh release create "$GITHUB_REF_NAME" dist/coding-journey-extension.zip \
            --title "Coding Journey extension v${version}" \
            --notes "$notes"
